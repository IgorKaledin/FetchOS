title    Fetch OS Live (KDE Plasma 6, Wayland)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 splash udev.log_level=3 vt.global_cursor_default=0 systemd.show_status=auto
